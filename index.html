<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>上海深秋新玩法 · 11/15–30</title>
<meta name="description" content="去过外滩和东方明珠之后的上海：11 月新展、梧桐区小马路、苏州河、虹口老街、赏秋时间表和本帮菜，配小红书推荐。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Noto+Serif+SC:wght@700;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

/* Layout: Philly-trip template (dark slate, gold accent, serif display) — sticky nav with route switch, full-bleed hero, card grids, center-line timeline, 2x2 tips. Deliberately single dark theme like the template. */
:root{
  color-scheme:dark;
  --bg:#020617; --panel:#0B1222; --panel-2:#0F172A; --line:#1E293B; --line-2:#334155;
  --fg:#F1F5F9; --dim:#94A3B8; --faint:#64748B;
  --gold:#FBBF24; --gold-soft:rgba(251,191,36,.1); --gold-line:rgba(251,191,36,.25);
  --dot:#4ADE80; --warn:#FCA5A5;
  --f-display:"Playfair Display","Noto Serif SC","Songti SC",Georgia,serif;
  --f-body:Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:rgba(2,6,23,.92)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1120px;margin:0 auto}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(2,6,23,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(30,41,59,.6)}
nav .inner{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap}
.logo b{color:var(--gold)}
.switch{display:flex;background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:3px;margin-left:auto}
.switch button{font:inherit;font-size:13px;font-weight:600;color:var(--dim);background:none;border:0;border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--gold);color:#1a1300}
.links{display:flex;gap:18px;font-size:13px;color:var(--dim)}
.links a{text-decoration:none}
.links a:hover{color:var(--fg)}
@media (max-width:720px){.links{order:3;width:100%;justify-content:space-between}.switch{margin-left:auto}}

/* hero */
.hero{position:relative;overflow:hidden;min-height:620px;display:flex;align-items:flex-end}
.hero .sky{position:absolute;inset:0}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,6,23,.15) 0%,rgba(2,6,23,.55) 55%,var(--bg) 100%)}
.hero svg.land{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%}
.hero .inner{position:relative;width:100%;padding-block:120px 64px;display:flex;flex-direction:column;gap:22px}
.eyebrow{display:flex;align-items:center;gap:12px;color:var(--gold);font-size:13px;font-weight:500;letter-spacing:.18em}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--gold)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(48px,9vw,96px);line-height:1.08;margin:0;text-wrap:balance}
h1 .w{color:#fff;display:block} h1 .g{color:var(--gold);display:block}
.intro{max-width:34em;color:#CBD5E1;font-size:17px;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;text-decoration:none;border:1px solid var(--line-2)}
.btn.primary{background:var(--gold);color:#1a1300;border-color:var(--gold)}
.btn:hover{filter:brightness(1.08)}
.stats{display:flex;flex-wrap:wrap;gap:20px 44px;margin-top:10px}
.stat{display:flex;flex-direction:column}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:34px;color:var(--gold);line-height:1.15;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;letter-spacing:.12em;color:var(--faint)}

/* sections */
section.block{padding-block:72px 24px}
.shead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:44px}
.shead .k{color:var(--gold);font-size:12px;letter-spacing:.24em;font-weight:500}
h2{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5vw,48px);margin:0;line-height:1.2;text-wrap:balance}
.shead p{color:var(--dim);margin:0;max-width:36em}
.group{margin-bottom:52px}
.group h3{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,30px);color:var(--gold);margin:0 0 22px;display:flex;gap:12px;align-items:center;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .2s}
.card:hover{border-color:var(--gold-line)}
.card .top{display:flex;gap:14px;align-items:flex-start}
.ico{flex:none;width:44px;height:44px;border-radius:12px;background:var(--line);display:grid;place-items:center;font-size:22px}
.card h4{margin:0;font-size:16px;font-weight:600;line-height:1.4}
.card .where{font-family:var(--f-mono);font-size:12px;color:var(--gold);margin-top:2px}
.card p{margin:0;color:#CBD5E1;font-size:14px}
.card .tip{font-size:13px;color:var(--gold);background:var(--gold-soft);border-radius:10px;padding:7px 11px}
.card .badge{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.06em;color:#1a1300;background:var(--gold);border-radius:999px;padding:2px 9px}
sup{line-height:0}
sup a{font-family:var(--f-mono);font-size:10px;color:var(--faint);text-decoration:none;padding:0 1px}
sup a:hover{color:var(--gold)}

.xhs{display:flex;align-items:center;gap:8px;font-size:13px;text-decoration:none;color:var(--fg);background:rgba(255,36,66,.08);border:1px solid rgba(255,36,66,.28);border-radius:10px;padding:7px 10px;min-width:0}
.xhs:hover{background:rgba(255,36,66,.16)}
.card > a.xhs:first-of-type{margin-top:auto}
.xhs .xb{flex:none;font-size:11px;font-weight:600;color:#fff;background:#FF2442;border-radius:5px;padding:1px 6px}
.xhs .xt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#E2E8F0}
.xrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.xhs.sm{display:inline-flex;padding:2px 8px 2px 3px;border-radius:7px;font-size:12px;color:#FDA4AF}

.card .ph{margin:-22px -22px 4px;position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:17px 17px 0 0;background:var(--line)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.card:hover .ph img{transform:scale(1.03)}
.card .ph figcaption{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(2,6,23,.72);border-radius:6px;padding:2px 7px}
.card .ph figcaption a{text-decoration:none;color:#E2E8F0}
.hero .sky{background-size:cover;background-position:center}
.hero .shade{background:linear-gradient(90deg,rgba(2,6,23,.92) 0%,rgba(2,6,23,.7) 45%,rgba(2,6,23,.25) 100%),linear-gradient(180deg,rgba(2,6,23,.2) 0%,rgba(2,6,23,.35) 60%,var(--bg) 100%)}
.hcredit{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;z-index:2;font-size:11px;color:#CBD5E1;text-decoration:none;background:rgba(2,6,23,.6);border-radius:6px;padding:2px 8px}
@media (max-width:600px){.hcredit{bottom:56px}}
@media (prefers-reduced-motion:reduce){.card .ph img{transition:none}}

/* timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:36px}
.tl::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)}
.day{position:relative;width:calc(50% - 40px);background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:18px}
.day:nth-child(odd){align-self:flex-start} .day:nth-child(even){align-self:flex-end}
.day::after{content:"";position:absolute;top:34px;width:13px;height:13px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 5px rgba(74,222,128,.15)}
.day:nth-child(odd)::after{right:-47px} .day:nth-child(even)::after{left:-47px}
.dtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;color:var(--gold);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:999px;padding:3px 12px}
.dtop .date{font-size:13px;color:var(--dim)}
.day h3{font-family:var(--f-display);font-weight:700;font-size:26px;margin:0;line-height:1.3;text-wrap:balance}
.day .sub{color:var(--dim);font-size:14px;margin:-12px 0 0}
.items{display:flex;flex-direction:column;gap:18px}
.it{display:flex;gap:14px}
.it .ico{width:40px;height:40px;font-size:19px;border-radius:11px}
.it .t{font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.it h5{margin:1px 0 3px;font-size:15px;font-weight:600;line-height:1.45}
.it p{margin:0;color:var(--dim);font-size:13.5px}
.it .cost{display:inline-block;margin-top:5px;font-family:var(--f-mono);font-size:12px;color:var(--fg);background:var(--line);border-radius:6px;padding:1px 8px}
.it.alert p{color:var(--warn)}
@media (max-width:860px){
  .tl::before{left:7px}
  .day{width:auto;margin-left:30px;align-self:stretch!important;padding:20px}
  .day::after{left:-30px!important;right:auto!important}
}

/* budget */
.budget{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:20px;overflow:hidden}
.btotal{display:flex;flex-wrap:wrap;gap:12px 40px;padding:24px 26px;border-bottom:1px solid var(--line)}
.btotal .v{font-family:var(--f-display);font-weight:900;font-size:40px;color:var(--gold);line-height:1.1}
.btotal .l{font-size:12px;color:var(--dim);letter-spacing:.06em}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:12px 26px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:500}
td.r,th.r{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td.n{color:var(--dim);font-size:13px}
tr:last-child td{border-bottom:0}
tr.sum td{font-weight:600;color:var(--gold);border-top:1px solid var(--gold-line)}
.est{font-size:11px;color:var(--warn);border:1px solid rgba(252,165,165,.35);border-radius:4px;padding:0 5px;margin-left:4px;white-space:nowrap}

/* tips */
.tips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.tips{grid-template-columns:1fr}}
.tipc{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tipc h4{margin:0;font-family:var(--f-display);font-size:21px;display:flex;gap:10px;align-items:center}
.tipc ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tipc li{display:flex;gap:10px;font-size:14px;color:#CBD5E1}
.tipc li::before{content:"•";color:var(--gold);font-weight:700}
.tipc.src li{font-size:13px}
.tipc.src li::before{content:none}
.tipc.src .id{font-family:var(--f-mono);color:var(--faint);flex:none;width:30px}
.tipc.src a{overflow-wrap:anywhere;text-decoration-color:var(--line-2)}
.tipc.wide{grid-column:1/-1}
.tipc.src ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px 24px}
li:target{background:var(--gold-soft);border-radius:6px}
:target{scroll-margin-top:90px}

footer{border-top:1px solid var(--line);margin-top:64px}
footer .inner{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:28px;font-size:12px;color:var(--faint)}
footer .logo{font-size:15px}
.scrollcue{position:absolute;left:50%;bottom:18px;width:20px;height:32px;border:1.5px solid var(--faint);border-radius:12px;transform:translateX(-50%)}
.scrollcue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:6px;border-radius:2px;background:var(--fg);transform:translateX(-50%);animation:cue 1.8s infinite}
@keyframes cue{0%{opacity:1;top:7px}70%{opacity:0;top:16px}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scrollcue::after{animation:none}.card{transition:none}}
</style>
</head>

function renderTrip(key){
  const T = TRIPS[key];
  const used = new Set();
  const collect = h => { (h.match(/#src-([A-Z]+\d*)/g)||[]).forEach(m=>used.add(m.slice(5))); return h; };
  const groups = T.groups.map(g=>`
    <div class="group"><h3><span aria-hidden="true">${g.icon}</span>${g.title}</h3><div class="grid">
      ${g.cards.map(c=>collect(`<div class="card">
        ${(()=>{const k=(CARDX[c.t]||[])[0]; return k&&PHOTO[k]?`<figure class="ph"><img src="img/${k}.jpg" alt="${esc(c.t)}" loading="lazy" decoding="async"><figcaption><a href="${xurl(k)}" target="_blank" rel="noopener">📷 小红书 @${esc(PHOTO[k])}</a></figcaption></figure>`:"";})()}
        ${c.badge?`<span class="badge">${c.badge}</span>`:""}
        <div class="top"><span class="ico" aria-hidden="true">${c.e}</span><div><h4>${c.t}</h4><div class="where">📍 ${c.w}</div></div></div>
        ${c.d?`<p>${c.d}</p>`:""}${c.tip?`<div class="tip">💡 ${c.tip}</div>`:""}
        ${xcard(CARDX[c.t])}
      </div>`)).join("")}
    </div></div>`).join("");
  const days = T.days.map(d=>`
    <article class="day"><div class="dtop"><span class="pill">Day ${d.n}</span><span class="date">${d.date}</span></div>
      <h3>${d.t}</h3><p class="sub">${d.sub}</p>
      <div class="items">${d.items.map(([e,t,h,p,c])=>collect(`<div class="it${e==="⚠️"?" alert":""}"><span class="ico" aria-hidden="true">${e}</span><div>
        <div class="t">${t}</div><h5>${h}</h5>${p?`<p>${p}</p>`:""}${c?`<span class="cost">${c}</span>`:""}${xitem(h)}</div></div>`)).join("")}</div>
    </article>`).join("");
  const B = T.budget;
  const budget = collect(`<div class="budget">
    <div class="btotal"><div><div class="v">${B.total}</div><div class="l">两人全付现金</div></div>
      ${B.alt.map(([v,l])=>`<div><div class="v" style="font-size:24px;padding-top:12px">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
    <div class="tbl"><table><thead><tr><th>项目</th><th>依据</th><th class="r">两人合计</th></tr></thead><tbody>
      ${B.rows.map(([a,b,c])=>`<tr><td>${a}</td><td class="n">${b}</td><td class="r">${c}</td></tr>`).join("")}
      <tr class="sum"><td>合计</td><td></td><td class="r">${B.total}</td></tr>
    </tbody></table></div></div>`);
  const tips = T.tips.map(t=>collect(`<div class="tipc"><h4><span aria-hidden="true">${t.icon}</span>${t.title}</h4><ul>${t.items.map(i=>`<li><span>${i}</span></li>`).join("")}</ul></div>`)).join("");
  const order = Object.keys(SRC).filter(k=>used.has(k));
  const srcCard = `<div class="tipc src wide"><h4><span aria-hidden="true">🔗</span>来源</h4><ul>${order.map(k=>`<li id="src-${k}"><span class="id">${k}</span><a href="${SRC[k][1]}" target="_blank" rel="noopener">${SRC[k][0]}</a></li>`).join("")}</ul></div>`;

  document.getElementById("app").innerHTML = `
  <section class="hero">${SKY[key]}<div class="shade"></div>
    <div class="inner gut">
      <div class="eyebrow">${T.eyebrow}</div>
      <h1><span class="w">${T.t1}</span><span class="g">${T.t2}</span></h1>
      <p class="intro">${T.intro}</p>
      <div class="cta"><a class="btn primary" href="#highlights">有什么好玩的？ ↓</a><a class="btn" href="#itinerary">📋 ${T.dayCount}行程</a></div>
      <div class="stats">${T.stats.map(([v,l])=>`<div class="stat"><span class="v">${v}</span><span class="l">${l}</span></div>`).join("")}</div>
    </div><span class="scrollcue" aria-hidden="true"></span>
  </section>
  <section class="block gut" id="highlights"><div class="inner">
    <div class="shead"><span class="k">${T.whyK}</span><h2>${T.why}</h2><p>${T.whySub}</p></div>${groups}
  </div></section>
  <section class="block gut" id="itinerary"><div class="inner">
    <div class="shead"><span class="k">${T.range}</span><h2>${T.dayCount}行程安排</h2><p>按真实日期排好了：周几开门、周几闭馆、哪天有免费活动。</p></div>
    <div class="tl">${days}</div>
  </div></section>
  <section class="block gut" id="budget"><div class="inner">
    <div class="shead"><span class="k">BUDGET · 2 人</span><h2>一共要花多少</h2></div>${budget}
  </div></section>
  <section class="block gut" id="tips"><div class="inner">
    <div class="shead"><span class="k">实用信息</span><h2>旅行贴士</h2></div>
    <div class="tips">${tips}${srcCard}</div>
  </div></section>`;

  document.getElementById("logo").innerHTML = T.logo;
  document.getElementById("flogo").innerHTML = T.logo;
  document.getElementById("fnote").textContent = T.foot;
  document.title = "上海深秋新玩法 · 11/15–30";
  document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.route===key)));
}
